<div class="page page--progress"><header class="page-header"><button class="btn-back" onclick="router.navigate('home')">← Back</button><h1>Your Progress</h1></header><main class="page-content"><section class="stats-grid" id="stats-section"></section><section class="stage-breakdown" id="stages-breakdown"></section><section class="achievements" id="achievements-section"></section></main></div><script>function initProgress(){renderStats();renderStageBreakdown();renderAchievements()}function renderStats(){const progress=dataManager.userProgress;const progressPercent=dataManager.getProgressPercentage();const completedLessons=progress.completedLessons.length;const totalLessons=dataManager.lessons.length;const html=`${Components.statCard('Overall Progress',`${progressPercent}%`,'📊')}${Components.statCard('Lessons Completed',completedLessons,'✓')}${Components.statCard('Current Streak',`${progress.streak} days`,'🔥')}${Components.statCard('Stages Unlocked',dataManager.stages.filter(s=>!s.locked).length,'🎯')}`;document.getElementById('stats-section').innerHTML=`<div class="stats-grid">${html}</div>`}function renderStageBreakdown(){const html=dataManager.stages.map(stage=>Components.stageCard(stage)).join('');document.getElementById('stages-breakdown').innerHTML=`<div class="stages-grid">${html}</div>`}function renderAchievements(){const achievements=[{name:'First Steps',description:'Complete your first lesson',earned:dataManager.userProgress.completedLessons.length>0},{name:'Week Warrior',description:'7 day streak',earned:dataManager.userProgress.streak>=7},{name:'Stage Master',description:'Complete a full stage',earned:dataManager.stages.some(s=>s.completed>=s.lessons)}];const html=achievements.map(a=>`<div class="achievement ${a.earned?'earned':'locked'}"><div class="achievement-icon">${a.earned?'🏆':'🔒'}</div><h3>${a.name}</h3><p>${a.description}</p></div>`).join('');document.getElementById('achievements-section').innerHTML=`<h2>Achievements</h2><div class="achievements-grid">${html}</div>`}initProgress();</script>
