<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#080c08">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Qur'an Quest">
  <meta name="description" content="Learn Qur'an, Tajweed, Hifdh and Islamic knowledge — free Islamic education app by Abuzayd Institute.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  
  <title>Qur'an Quest — Interactive Learning Platform</title>
  
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Lato:wght@300;400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- Core & Reset Styles (includes theme variables + base components) -->
  <link rel="stylesheet" href="css/core.css">
  
  <!-- Navigation & Header -->
  <link rel="stylesheet" href="css/nav.css">

  <!-- Buttons, cards, progress bars, modals, etc. -->
  <link rel="stylesheet" href="css/components.css">

  <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      var saved = localStorage.getItem('qg_theme');
      var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- Navigation will be rendered here by JS -->
  <nav id="navigation"></nav>
  
  <!-- Main content area -->
  <main id="app-container"></main>
  
  <!-- Teacher mode toolbar -->
  <div id="tm-toolbar" class="tm-toolbar"></div>
  <div id="tm-notebook" class="tm-notebook"></div>
  <div id="tm-export-overlay" class="tm-export-overlay"></div>
  <div id="tm-cert-overlay" class="tm-cert-overlay"></div>
  <canvas id="tm-marker-canvas" class="tm-marker-canvas"></canvas>
  <div id="tm-pointer-dot" class="tm-pointer-dot"></div>
  
  <!-- Beginner section toolbar -->
  <div id="bq-toolbar" class="bq-toolbar"></div>
  <div id="bq-toolbar-tab" class="bq-toolbar-tab"></div>
  <canvas id="bq-mark-canvas" class="bq-mark-canvas"></canvas>
  
  <!-- Modals & Overlays -->
  <div id="presence-toast" class="presence-toast"></div>
  
  <!-- Application scripts (order matters: data/theme/components before router/app) -->
  <script src="js/data-manager.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/router.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
