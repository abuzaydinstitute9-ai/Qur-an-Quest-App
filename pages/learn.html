<div class="page page--learn"><header class="page-header"><button class="btn-back" onclick="router.navigate('home')">← Back</button><h1>Learn</h1></header><main class="page-content"><section class="stages" id="stages-container"></section><section class="lessons" id="lessons-container"></section></main></div><script>function initLearn(){renderStages();renderLessonsForStage(dataManager.userProgress.currentStage)}function renderStages(){const stagesHTML=dataManager.stages.map(stage=>`<div class="stage-tab ${!stage.locked?'active':'locked'}" onclick="renderLessonsForStage(${stage.id})" data-stage-id="${stage.id}"><span class="stage-icon">${stage.icon}</span><span class="stage-name">${stage.name}</span>${stage.locked?'<span class="lock">🔒</span>':''}</div>`).join('');document.getElementById('stages-container').innerHTML=`<div class="stages-scroll">${stagesHTML}</div>`}function renderLessonsForStage(stageId){const lessons=dataManager.getStageLeasons(stageId);const stage=dataManager.stages.find(s=>s.id===stageId);if(stage.locked){document.getElementById('lessons-container').innerHTML=`<div class="locked-message"><p>🔒 Complete the previous stage to unlock this content</p></div>`;return}const lessonsHTML=lessons.map(lesson=>{const completed=dataManager.userProgress.completedLessons.includes(lesson.id);return Components.lessonCard(lesson,completed)}).join('');document.getElementById('lessons-container').innerHTML=`<div class="lessons-grid">${lessonsHTML}</div>`;document.querySelectorAll('.lesson-card').forEach(card=>{card.addEventListener('click',()=>{const lessonId=parseInt(card.dataset.lessonId);const lesson=dataManager.lessons.find(l=>l.id===lessonId);showLessonDetail(lesson)})})}function showLessonDetail(lesson){const modal=document.createElement('div');modal.className='modal modal--active';modal.innerHTML=`<div class="modal-content"><button class="modal-close" onclick="this.parentElement.parentElement.remove()">×</button><div class="lesson-detail"><h2>Lesson: ${lesson.title}</h2><div class="lesson-section"><h3>Letter</h3><div class="letter-display">${lesson.arabic}</div></div><div class="lesson-section"><h3>Pronunciation</h3><p>${lesson.transliteration}</p><button class="btn btn--secondary" onclick="playAudio('${lesson.audio}')">🔊 Play Audio</button></div><div class="lesson-section"><h3>Articulation Point (Makhraj)</h3><p>${lesson.makhraj}</p></div><div class="lesson-section"><h3>Example</h3><p>${lesson.example}</p></div><div class="lesson-actions"><button class="btn btn--primary" onclick="completeLessonAction(${lesson.id})">✓ Mark Complete</button><button class="btn btn--secondary" onclick="this.parentElement.parentElement.parentElement.remove()">Close</button></div></div></div>`;document.body.appendChild(modal)}function playAudio(url){const audio=new Audio(url);audio.play().catch(e=>console.log('Audio playback failed:',e))}function completeLessonAction(lessonId){const completed=dataManager.completeLesson(lessonId);if(completed){alert('Great! Lesson completed! 🎉');document.querySelector('.modal').remove();initLearn()}}initLearn();</script>
