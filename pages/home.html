<div class="page page--home"><header class="page-header"><div class="header-top"><h1>Quran Quest</h1><button id="theme-toggle" class="theme-toggle">🌙</button></div><div id="user-stats" class="user-stats"></div></header><main class="page-content"><section class="continue-learning"><div id="continue-card" class="card card--large"></div></section><section class="quick-access"><h2>Quick Access</h2><div class="quick-buttons"><button class="quick-btn" onclick="router.navigate('learn')"><span class="icon">📚</span><span>Learn</span></button><button class="quick-btn" onclick="router.navigate('practice')"><span class="icon">✏️</span><span>Practice</span></button><button class="quick-btn" onclick="router.navigate('progress')"><span class="icon">📊</span><span>Progress</span></button><button class="quick-btn" onclick="router.navigate('profile')"><span class="icon">👤</span><span>Profile</span></button></div></section><section class="motivation"><div class="motivation-card"><h3>Daily Challenge</h3><p>Complete 3 lessons today to extend your streak!</p><div class="motivation-progress" id="daily-progress"></div></div></section></main></div><script>function initHome(){renderUserStats();renderContinueCard();renderDailyProgress()}function renderUserStats(){const progress=dataManager.userProgress;const progressPercent=dataManager.getProgressPercentage();const statsHTML=`<div class="stat-item"><div class="stat-value">${progress.streak}</div><div class="stat-label">Day Streak 🔥</div></div><div class="stat-item"><div class="stat-value">${progressPercent}%</div><div class="stat-label">Overall Progress</div></div><div class="stat-item"><div class="stat-value">${progress.completedLessons.length}</div><div class="stat-label">Lessons Complete</div></div>`;document.getElementById('user-stats').innerHTML=statsHTML}function renderContinueCard(){const nextLesson=dataManager.getNextLesson();if(nextLesson){const stage=dataManager.stages.find(s=>s.id===nextLesson.stageId);const html=`<div class="continue-card__content"><h2>Continue Learning</h2><p>Stage: ${stage.name}</p><div class="lesson-preview"><div class="lesson-preview__arabic">${nextLesson.arabic}</div><div class="lesson-preview__title">${nextLesson.title}</div><div class="lesson-preview__trans">${nextLesson.transliteration}</div></div><button class="btn btn--primary" onclick="router.navigate('learn')">Start Learning</button></div>`;document.getElementById('continue-card').innerHTML=html}else{document.getElementById('continue-card').innerHTML=`<div class="continue-card__content"><h2>🎉 Congratulations!</h2><p>You've completed all lessons!</p><button class="btn btn--primary" onclick="router.navigate('progress')">View Certificate</button></div>`}}function renderDailyProgress(){const completed=dataManager.userProgress.completedLessons.length;const percent=Math.min(completed%3/3*100,100);const html=`<div class="progress-bar"><div class="progress-bar__fill" style="width: ${percent}%"></div></div><p class="progress-text">Complete ${3-completed%3} more lessons today</p>`;document.getElementById('daily-progress').innerHTML=html}initHome();</script>
