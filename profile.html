<div class="page page--profile"><header class="page-header"><button class="btn-back" onclick="router.navigate('home')">← Back</button><h1>Profile</h1></header><main class="page-content"><section class="profile-section"><div class="profile-card"><div class="avatar">👤</div><h2 id="user-name">Learner</h2><p id="user-level">Level: Beginner</p></div></section><section class="settings-section"><h2>Settings</h2><div class="settings-group"><div class="setting-item"><label>Learning Level</label><select id="level-select" onchange="updateLevel(this.value)"><option value="beginner">Beginner</option><option value="intermediate">Intermediate</option><option value="advanced">Advanced</option></select></div><div class="setting-item"><label>Theme</label><button id="profile-theme-btn" class="btn btn--secondary" onclick="themeManager.toggle();syncProfileThemeBtn()"></button></div></div></section><section class="danger-section"><h2>Danger Zone</h2><button class="btn btn--danger" onclick="resetProgressConfirm()">Reset All Progress</button></section></main></div><script>function initProfile(){const level=dataManager.userProgress.level;document.getElementById('user-level').textContent=`Level: ${level.charAt(0).toUpperCase()+level.slice(1)}`;document.getElementById('level-select').value=level;syncProfileThemeBtn()}function syncProfileThemeBtn(){const btn=document.getElementById('profile-theme-btn');if(btn)btn.textContent=`Current: ${themeManager.currentTheme==='dark'?'🌙 Dark':'☀️ Light'}`}function updateLevel(newLevel){dataManager.userProgress.level=newLevel;dataManager.saveProgress();alert(`Level updated to ${newLevel}!`);initProfile()}function resetProgressConfirm(){if(confirm('Are you sure? This cannot be undone.')){dataManager.resetProgress();alert('Progress reset! Reloading...');location.reload()}}initProfile();</script>
